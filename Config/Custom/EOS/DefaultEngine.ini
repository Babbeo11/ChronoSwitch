; EOS build configuration (itch.io / non-Steam release).
; This file is layered on top of Config/DefaultEngine.ini when the game or editor
; is launched with -CustomConfig=EOS, or when packaged with CustomConfig=EOS
; (Project Settings > Packaging > Custom Config).
; EOS credentials live in the base DefaultEngine.ini ([/Script/OnlineSubsystemEOS.EOSSettings]).

[OnlineSubsystem]
DefaultPlatformService=EOS

[OnlineSubsystemSteam]
bEnabled=false

[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SocketSubsystemEOS.NetDriverEOS",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
